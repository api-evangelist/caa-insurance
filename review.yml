actions:
  apisListed: 0
  openapiDirectoryCreated: false
  reason: |
    No public API, no developer portal, and no downloadable specification exists, so
    apis[] is intentionally empty and no openapi/ directory was created. Recording
    the absence accurately — partner-gated broker portal, no ACORD or CSIO reference,
    no exposed quote/bind/issue/FNOL verbs — is the correct outcome for this record.
