note: >-
  CAA Insurance publishes no API program of its own. However the CAA Broker
  Portal at www.caabrokerportal.ca — a host whose TLS certificate is issued to
  "CAA South Central Ontario Systems and Services Inc." — runs Microsoft
  SharePoint (MicrosoftSharePointTeamServices 16.0.0.5552, Microsoft-IIS/10.0)
  and serves the standard SharePoint SOAP web-service WSDL documents
  anonymously at /_vti_bin/<service>.asmx?WSDL. Twenty WSDL documents covering
  199 operations were harvested verbatim on 2026-07-25. IMPORTANT SCOPE NOTE:
  these are platform-provided Microsoft product contracts, not a CAA-authored
  insurance API — there is no quote, bind, issue, or FNOL operation anywhere in
  them, and every data operation requires an authenticated SharePoint session
  (the sibling REST/OData surface at /_api/web returns HTTP 403
  System.UnauthorizedAccessException anonymously). The contracts are recorded
  because they are the only machine-readable API description reachable in the
  CAA Insurance estate, and because they define exactly what the broker
  integration surface is: document/list/site collaboration, not insurance
  transactions.
